[project]
name = "veille-agents"
version = "0.1.0"
description = "Veille concurrentielle multi-agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "groq>=1.7.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veille"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
