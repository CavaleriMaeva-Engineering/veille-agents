[project]
name = "veille-agents"
version = "0.1.0"
description = "Veille concurrentielle multi-agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apify-client>=3.3.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veille"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
# Modèles locaux du RAG (PyTorch : très lourd). Installés par défaut en local, exclus de l'image Docker par défaut.
rag = [
    "sentence-transformers>=6.2.0",
]

[tool.uv]
default-groups = ["dev", "rag"]
